version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: deposit360_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aicte_user
      POSTGRES_PASSWORD: aicte_secure_password_2026
      POSTGRES_DB: deposit360_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicte_user -d deposit360_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: deposit360_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: deposit360_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://aicte_user:aicte_secure_password_2026@db:5432/deposit360_db
      SECRET_KEY: aicte_sih2026_super_secret_jwt_key_deposit360_production_ready
      STORAGE_DIR: /app/storage/vault
      ENABLE_BANK_SANDBOX: "true"
    ports:
      - "8000:8000"
    volumes:
      - vault_data:/app/storage/vault
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    container_name: deposit360_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  vault_data:
