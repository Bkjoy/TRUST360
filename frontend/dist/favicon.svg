  <path d="M50 13 L50 86" stroke="#0d9488" stroke-width="1.5" stroke-opacity="0.4" />
  <path d="M26 36 L74 36" stroke="#0d9488" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Stylized Monogram "T" + Security Vault Motif -->
  <path d="M30 30 C30 28.8954 30.8954 28 32 28 H68 C69.1046 28 70 28.8954 70 30 V37 C70 38.1046 69.1046 39 68 39 H57 V50 C57 50 61 52 61 57 C61 63 56 67 50 67 C44 67 39 63 39 57 C39 52 43 50 43 50 V39 H32 C30.8954 39 30 38.1046 30 37 Z" 
        fill="url(#trustShieldGrad)" />

  <!-- Central Vault Lock Core -->
  <circle cx="50" cy="57" r="5.5" fill="#0f172a" stroke="url(#trustShieldGrad)" stroke-width="2" />
  <path d="M49 55 H51 V61 H49 Z" fill="#14b8a6" />

  <!-- Security Check Verification Accent -->
  <path d="M44 73 L48 77 L57 68" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
